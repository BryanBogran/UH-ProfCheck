# CLA Assistant Lite: blocks pull requests until each author signs CLA.md.
#
# Setup for Bryan (one time):
# 1. Settings → Actions → General → Workflow permissions: "Read and write permissions".
# 2. Create the signatures branch once:
#      git switch --orphan cla-signatures && git commit --allow-empty -m "CLA signatures" && git push origin cla-signatures
#    Then protect it (Settings → Branches) so only you and GitHub Actions can push.
# 3. After branch protection on main is on, add "CLAAssistant" as a required status check.
# 4. Signatures are stored in this repo, so GITHUB_TOKEN is enough. Only add a
#    PERSONAL_ACCESS_TOKEN secret if you later move signatures to a separate repo.
# 5. Remove the DRAFT banner from CLA.md once legal review is done, before the first outside merge.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/BryanBogran/UH-ProfCheck/blob/main/CLA.md
          branch: cla-signatures
          allowlist: BryanBogran,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thanks for contributing to ProfCheck. Before we can merge, please read the
            [Contributor License Agreement](https://github.com/BryanBogran/UH-ProfCheck/blob/main/CLA.md)
            and sign it by commenting the sentence below on this pull request.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you.
